<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>DigiLocker Verification</title></head>
<body style="font-family:sans-serif;text-align:center;padding-top:60px">
  <h1 id="status">Verifying your identity...</h1>
  <p id="detail"></p>
  <script>
  const params = new URLSearchParams(window.location.search);
const code = params.get('code');
const state = params.get('state');
if (code) {
 fetch('https://bankme-backend.onrender.com/digilocker/token', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ code: code, state: state })
  })
      .then(function(r){ return r.json(); })
      .then(function(data){
  console.log('KYC callback response:', JSON.stringify(data));
  document.getElementById('status').innerText =
    data.success ? '✅ KYC Verified!' : 'Verification failed';
  document.getElementById('detail').innerText =
    data.success ? 'Your PAN has been verified. Please log in again to continue.' : 'Please try again.';
  if (data.success) {
    setTimeout(function(){
      window.location.href = 'https://bankme.co.in/app.html';
    }, 3000);
  }
})
      .catch(function(){
        document.getElementById('status').innerText = 'Connection error';
      });
    } else {
      document.getElementById('status').innerText = 'No authorization code received';
    }
  </script>
</body>
</html>
