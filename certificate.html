<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BankMe Certificate</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#eef1f7;--text:#14213d;--muted:#5b6478}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--text:#eef1fa;--muted:#9aa4bd}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px}
.bar{max-width:1123px;margin:0 auto 10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar button{background:#0a7cff;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:.9rem;cursor:pointer}
#msg{color:var(--muted);font-size:.85rem}
.wrap{overflow:auto}
/* The sheet is always light so it prints correctly. A4 landscape. */
.sheet{width:297mm;height:210mm;margin:0 auto;background:#fff;color:#14213d;position:relative;padding:12mm;font-family:Georgia,'Times New Roman',serif}
.frame{position:absolute;inset:6mm;border:2.2mm double #1e2f8a}
.in{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:6mm 10mm}
.brand{font-family:system-ui,Arial,sans-serif;font-weight:900;font-size:11mm;color:#1e2f8a;letter-spacing:.5mm}
.brand span{color:#0a7cff}
.by{font-family:system-ui,Arial,sans-serif;font-size:3.2mm;color:#5b6478;margin-top:-1mm}
h1{font-size:10mm;margin:5mm 0 1mm;letter-spacing:.6mm;color:#1e2f8a}
.sub{font-size:4.2mm;color:#5b6478;margin-bottom:5mm}
.txt{font-size:4.6mm;line-height:1.7;max-width:230mm}
.shop{font-size:9mm;font-weight:700;margin:2mm 0;color:#14213d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2mm 14mm;margin-top:5mm;text-align:left;font-family:system-ui,Arial,sans-serif;font-size:3.6mm;width:230mm}
.grid b{color:#5b6478;font-weight:600}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;width:100%;font-family:system-ui,Arial,sans-serif;font-size:3.2mm;color:#5b6478}
.qr{text-align:center}.qr div{display:inline-block}
.id{font-size:5mm;color:#1e2f8a;font-weight:700;letter-spacing:.4mm}
@media (max-width:1100px){.sheet{transform-origin:top left}}
@page{size:A4 landscape;margin:0}
@media print{
  body{background:#fff;padding:0}.bar,#msg{display:none!important}.wrap{overflow:visible}
  .sheet{margin:0;transform:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head><body>
<div class="bar"><button id="pbtn" onclick="window.print()" style="display:none">Print / Save as PDF</button><span id="msg">Loading…</span></div>
<div class="wrap"><div class="sheet" id="sheet" style="display:none">
 <div class="frame"></div>
 <div class="in">
  <div class="brand">Bank<span>Me</span></div>
  <div class="by">by PayPe Technologies Pvt. Ltd.</div>
  <h1 id="title">CERTIFICATE OF AUTHORISATION</h1>
  <div class="sub" id="role"></div>
  <div class="txt">This is to certify that</div>
  <div class="shop" id="shop"></div>
  <div class="txt" id="owner"></div>
  <div class="txt" id="addr"></div>
  <div class="grid" id="grid"></div>
  <div class="foot">
   <div id="co" style="text-align:left;max-width:100mm"></div>
   <div class="qr"><div id="qr"></div><div style="margin-top:1mm">Scan to verify</div><div class="id" id="nid"></div></div>
   <div style="text-align:right;max-width:80mm">Valid while the account is active and in good standing.<br>Verify at bankme.co.in</div>
  </div>
 </div>
</div></div>
<script>
/* Edit these company lines to your exact registered details. */
var COMPANY={name:'PayPe Technologies Pvt. Ltd.',address:'Coimbatore, Tamil Nadu, India',email:'itsupport@paype.co.in',web:'www.bankme.co.in'};
var BASE='https://bankme-backend.onrender.com';
function g(id){return document.getElementById(id);}
function fit(){var s=g('sheet'),w=window.innerWidth-24,sw=s.offsetWidth; if(w<sw){var k=w/sw; s.style.transform='scale('+k+')'; s.parentNode.style.height=(s.offsetHeight*k)+'px';} else {s.style.transform='none'; s.parentNode.style.height='auto';}}
function line(k,v){var d=document.createElement('div'); var b=document.createElement('b'); b.textContent=k+': '; d.appendChild(b); d.appendChild(document.createTextNode(v)); g('grid').appendChild(d);}
function show(c){
  g('msg').style.display='none'; g('pbtn').style.display='';
  g('sheet').style.display='block';
  g('role').textContent='Authorised BankMe '+c.roleLabel;
  g('shop').textContent=c.shopName;
  g('owner').textContent='owned and operated by '+c.ownerName+', is an authorised BankMe '+c.roleLabel+' for providing BankMe financial services.';
  g('addr').textContent='Shop location: '+c.shopAddress;
  line('Network ID',c.networkId);
  line('Authorised as',c.roleLabel);
  line('Authorised since',new Date(c.since).toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'}));
  if(c.licenseNo) line((c.bizCert||'Licence'),c.licenseNo);
  if(c.lat&&c.lng) line('Location',Number(c.lat).toFixed(5)+', '+Number(c.lng).toFixed(5));
  g('nid').textContent=c.networkId;
  g('co').textContent=COMPANY.name+' · '+COMPANY.address+' · '+COMPANY.email+' · '+COMPANY.web;
  try{ new QRCode(g('qr'),{text:c.verifyUrl,width:110,height:110,correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
  fit();
}
function fail(m){g('msg').textContent=m;}
(function(){
  var k=new URLSearchParams(location.search).get('k');
  var req;
  if(k){ req=fetch(BASE+'/certificate/view?k='+encodeURIComponent(k)); }
  else {
    var t=''; try{t=localStorage.getItem('bankme_token')||'';}catch(e){}
    if(!t){fail('Please sign in to bankme.co.in first, then open this page again.');return;}
    req=fetch(BASE+'/certificate/me',{headers:{Authorization:'Bearer '+t}});
  }
  req.then(function(r){return r.json();}).then(function(d){ if(d&&d.success) show(d.cert); else fail((d&&d.message)||'Could not load the certificate.'); }).catch(function(){fail('Network error. Try again.');});
  window.addEventListener('resize',fit);
})();
</script></body></html>
